# HAProxy 2.x example. Adapt to your topology.
# The stick-table tracks source addresses and provides cheap L7 throttling.

global
    maxconn 20000
    # log /dev/log local0

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 30s
    timeout http-request 10s

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/example.pem

    # 20k source-IP entries, 10-minute rolling window.
    stick-table type ip size 200k expire 10m store http_req_rate(10s),conn_rate(10s),conn_cur
    tcp-request connection track-sc0 src

    # Example thresholds; tune from baseline measurements.
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    tcp-request connection reject if { sc_conn_rate(0) gt 50 }
    tcp-request connection reject if { sc_conn_cur(0) gt 100 }

    default_backend app

backend app
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8080 check

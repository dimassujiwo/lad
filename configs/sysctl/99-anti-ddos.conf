# Review every value for your workload before production use.
# Keep an out-of-band console path.

# Reduce exposure to obvious source-address spoofing on routed hosts.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN-cookie protection when the SYN backlog overflows.
net.ipv4.tcp_syncookies = 1

# Increase queue capacity moderately; size this with memory and workload.
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096

# Reuse of TIME_WAIT sockets for outbound client workloads.
# Do NOT use obsolete tcp_tw_recycle.
net.ipv4.tcp_fin_timeout = 30

# Reasonable ephemeral port range for busy proxy/client workloads.
net.ipv4.ip_local_port_range = 10240 65535

# ICMP redirect hardening for servers that should not accept redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source routing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
